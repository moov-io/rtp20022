# Use https://app.stepsecurity.io/ to improve workflow security
name: Create Release

on:
  push:
    tags: [ "v*.*.*" ]

permissions:
  contents: read

jobs:
  testing:
    name: Testing
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: false
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Install
      run: make install

    - name: Check
      run: make check

  create_release:
    permissions:
      contents: write
    name: Create Release
    needs: [testing]
    runs-on: ubuntu-latest
    steps:
    # actions/create-release@v1 fails when the release already exists (e.g. created by
    # `gh release create` before the tag workflow runs) and used github.ref
    # ("refs/tags/vX.Y.Z") as the tag name. Ensure the release exists idempotently.
    - name: Ensure GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
          echo "Release $TAG already exists — nothing to do"
        else
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$TAG" \
            --generate-notes
        fi
